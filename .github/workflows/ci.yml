name: CI - Docs Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Markdown files exist
        run: |
          echo "Checking required docs structure..."
          test -f docs/index.md && echo "✅ docs/index.md exists"
          test -f docs/roles/software-dev.md && echo "✅ docs/roles/software-dev.md exists"
          test -f docs/roles/product-mgr.md && echo "✅ docs/roles/product-mgr.md exists"
          test -f docs/roles/data-sci.md && echo "✅ docs/roles/data-sci.md exists"
          echo "All required files present!"

      - name: Lint Markdown (optional)
        run: npm run lint --if-present
